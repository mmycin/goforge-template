version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/database/migrations"
    queries: "internal/database/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/database/gen"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        overrides: []
        omit_unused_structs: true
